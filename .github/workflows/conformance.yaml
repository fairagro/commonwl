name: 📎 Conformance Runner

permissions:
  contents: read
  pull-requests: write
  actions: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: "true"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Build conformance binary
        run: cargo build --release
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: conformance
          path: target/release/conformance
          retention-days: 1

  ci-pipeline:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(vars.BACKEND || '["docker", "local", "tes"]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: "true"
      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: conformance
          path: target/release
      - run: chmod +x target/release/conformance

      - name: Start TES dev environment (rustfs + funnel)
        if: matrix.variant == 'tes'
        run: .dev/tes_env.sh start

      - name: Start Funnel watchdog
        if: matrix.variant == 'tes'
        run: |
          nohup .dev/tes_env.sh watchdog > funnel-watchdog.log 2>&1 &
          echo "WATCHDOG_PID=$!" >> "$GITHUB_ENV"

      - name: Run Conformance Tests
        continue-on-error: true
        env:
          BACKEND: ${{ matrix.variant }}
          AWS_ACCESS_KEY_ID: rustfsadmin
          AWS_SECRET_ACCESS_KEY: rustfsadmin
          S3_ENDPOINT_URL: http://localhost:9000
          AWS_REGION: us-east-1
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install cwltest
          mkdir badges
          cwltest --test testdata/cwl/conformance_tests.yaml \
            -j 3 \
            --tool target/release/conformance \
            --badgedir badges/$BACKEND
          exit 0

      - name: Stop Funnel
        if: always() && matrix.variant == 'tes'
        run: |
          curl -s "http://localhost:8000/v1/tasks?view=FULL" | jq '.tasks[] | {id, state, logs}'
          [ -n "$WATCHDOG_PID" ] && kill "$WATCHDOG_PID" 2>/dev/null || true
          .dev/tes_env.sh stop

      - name: Generate Summary
        env:
          BACKEND: ${{ matrix.variant }}
        run: |
          echo "## Conformance for Backend: $BACKEND" >> $GITHUB_STEP_SUMMARY
          TABLE="| Subject        | Status | Badge                                      |"
          TABLE="$TABLE\n|----------------|--------|--------------------------------------------|"
          for file in badges/$BACKEND/*.json; do
            SUBJECT=$(jq -r '.subject' $file)
            STATUS=$(jq -r '.status' $file)
            COLOR=$(jq -r '.color' $file)
            BADGE_URL="https://img.shields.io/badge/$SUBJECT-${STATUS}25-$COLOR"
            TABLE="$TABLE\n| $SUBJECT       | $STATUS | ![$SUBJECT]($BADGE_URL)                  |"
          done
          echo -e "$TABLE"
          echo -e "$TABLE" >> $GITHUB_STEP_SUMMARY
