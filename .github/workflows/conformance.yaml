name: 📎 Conformance Runner

permissions:
  contents: read
  pull-requests: write
  actions: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: "true"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Build conformance binary
        run: cargo build --release
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: conformance
          path: target/release/conformance
          retention-days: 1

  ci-pipeline:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: ${{ fromJson(vars.BACKEND || '["docker", "local", "tes"]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: "true"
      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: conformance
          path: target/release
      - run: chmod +x target/release/conformance

      - name: Start rustfs
        if: matrix.variant == 'tes'
        run: |
          mkdir logs data
          sudo chown 10001:10001 logs data
          docker run -d -p 9000:9000 -p 9001:9001 \
            -v $(pwd)/data:/data \
            -v $(pwd)/logs:/logs \
            rustfs/rustfs:latest
          sleep 10
          curl -sf http://localhost:9000/health

      - name: Create S3 bucket
        if: matrix.variant == 'tes'
        env:
          AWS_ACCESS_KEY_ID: rustfsadmin
          AWS_SECRET_ACCESS_KEY: rustfsadmin
        run: |
          aws s3 mb s3://commonwl-bucket \
            --endpoint-url http://localhost:9000 \
            --region us-east-1

      - name: Start Funnel
        if: matrix.variant == 'tes'
        run: |
          FUNNEL_VERSION=$(curl -s https://api.github.com/repos/calypr/funnel/releases/latest \
            | jq -r '.tag_name')
          curl -sL "https://github.com/calypr/funnel/releases/download/${FUNNEL_VERSION}/funnel-linux-amd64-${FUNNEL_VERSION}.tar.gz" \
            | tar -xz
          chmod +x funnel
          ./funnel server run --config ./.github/funnel-config.yaml &
          FUNNEL_PID=$!
          echo "FUNNEL_PID=$FUNNEL_PID" >> $GITHUB_ENV

          until curl -sf http://localhost:8000/v1/tasks; do
            sleep 1
          done

      - name: Run Conformance Tests
        continue-on-error: true
        env:
          BACKEND: ${{ matrix.variant }}
          AWS_ACCESS_KEY_ID: rustfsadmin
          AWS_SECRET_ACCESS_KEY: rustfsadmin
          S3_ENDPOINT_URL: http://localhost:9000
          AWS_REGION: us-east-1
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install cwltest
          mkdir badges
          cwltest --test testdata/cwl/conformance_tests.yaml \
            -j 4 \
            --tool target/release/conformance \
            --badgedir badges/$BACKEND
          exit 0

      - name: Stop Funnel
        if: always() && matrix.variant == 'tes'
        run: |
          curl -s "http://localhost:8000/v1/tasks?view=FULL" | jq '.tasks[] | {id, state, logs}'
          [ -n "$FUNNEL_PID" ] && kill "$FUNNEL_PID" || true

      - name: Stop rustfs
        if: always() && matrix.variant == 'tes'
        run: docker rm -f rustfs || true

      - name: Generate Summary
        env:
          BACKEND: ${{ matrix.variant }}
        run: |
          echo "## Conformance for Backend: $BACKEND" >> $GITHUB_STEP_SUMMARY
          TABLE="| Subject        | Status | Badge                                      |"
          TABLE="$TABLE\n|----------------|--------|--------------------------------------------|"
          for file in badges/$BACKEND/*.json; do
            SUBJECT=$(jq -r '.subject' $file)
            STATUS=$(jq -r '.status' $file)
            COLOR=$(jq -r '.color' $file)
            BADGE_URL="https://img.shields.io/badge/$SUBJECT-${STATUS}25-$COLOR"
            TABLE="$TABLE\n| $SUBJECT       | $STATUS | ![$SUBJECT]($BADGE_URL)                  |"
          done
          echo -e "$TABLE"
          echo -e "$TABLE" >> $GITHUB_STEP_SUMMARY
