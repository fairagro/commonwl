name: 🦆 CWL Conformance Tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  cwl-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run CWL conformance examples
        run: |
          set -e
          shopt -s globstar nullglob

          for file in testdata/cwl/tests/**/*.cwl; do
            echo "Running on $file"
            cargo run --example cwl_load "$file"
          done
