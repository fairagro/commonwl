[package]
name = "cwl_engine"
description = "Part of `CommonWL`. CWL Execution"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[lib]
path = "lib.rs"

[features]
tes = [] # TES Feature is experimental!

[dependencies]
# serialization
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
cwl_core.workspace = true

# runtime
crankshaft = { version = "0.9.0", features = ["docker"] }
boa_engine = "0.21.0"
bollard = "^0.19"
tokio.workspace = true
tokio-util.workspace = true
futures-util = "0.3.31"

# io
sha1.workspace = true
base16ct.workspace = true
pathdiff = "0.2.3"
tempfile.workspace = true
tar = "0.4.45"
dircpy.workspace = true
url.workspace = true
cwl_engine_storage = { path = "../storage" }

# rdf
rdf = "0.1.4"
horned-owl = "1.0.0"

# util
anyhow.workspace = true
bon.workspace = true
tracing.workspace = true
async-trait.workspace = true
shlex = "1.3.0"
nix = { version = "0.31.2", features = ["user"] }
nonempty = "0.12.0"
sysinfo = "0.38.0"
semver = "1.0.27"
indexmap = "2.13.0"
regex = "1.12.2"
urlencoding = "2.1.3"
uuid.workspace = true
