[package]
name = "cwl_engine"
description = "Part of `CommonWL`. CWL Execution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[lib]
path = "lib.rs"

[package.metadata.docs.rs]
all-features = true

[features]
tes = [] # TES Feature is experimental!

[dependencies]
# serialization
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
cwl_core.workspace = true

# runtime
crankshaft = { version = "0.10.0", features = ["docker"] }
boa_engine = "0.21.1"
bollard = "^0.19"
tokio.workspace = true
tokio-util.workspace = true
futures-util = "0.3.32"

# io
dunce.workspace = true
sha1.workspace = true
base16ct.workspace = true
pathdiff = "0.2.3"
tempfile.workspace = true
tar = "0.4.46"
dircpy.workspace = true
url.workspace = true
cwl_engine_storage = { version = "0", path = "../storage" }

# rdf
rdf = "0.1.4"
horned-owl = "2.1.0"

# util
anyhow.workspace = true
bon.workspace = true
tracing.workspace = true
async-trait.workspace = true
nonempty = "0.12.0"
sysinfo = "0.39.2"
semver = "1.0.28"
urlencoding = "2.1.3"
indexmap = "2.14.0"
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["user"] }

[dev-dependencies]
regex = "1.12.3"
