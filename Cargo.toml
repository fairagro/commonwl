[workspace]
members = [
    "crates/commonwl",
    "crates/conformance",
    "crates/core",
    "crates/engine",
    "crates/lsp",
    "crates/salad",
    "crates/salad_derive",
    "crates/storage",
]

resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
repository = "https://github.com/fairagro/commonwl"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
base16ct = "1.0.0"
bon = "3.9.1"
cwl_core = { version = "0", path = "crates/core" }
dircpy = "0.3.20"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.143"
serde-saphyr = { version = "0.0.26", features = ["miette", "validator"] }
sha1 = "0.11.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tempfile = "3.27.0"
tokio = { version = "1.51.0", features = ["full"] }
tokio-util = "0.7.18"
url = "2.5.8"
uuid = { version = "1.23.0", features = ["v4"] }
thiserror = "2.0.18"
validator = { version = "0.20.0", features = ["derive"] }
