[workspace]
members = [
    "crates/commonwl",
    "crates/conformance",
    "crates/core",
    "crates/engine",
    "crates/salad",
    "crates/salad_derive",
]

resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
repository = "https://github.com/fairagro/commonwl"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.102"
bon = "3.8.1"
cwl_core = { version = "*", path = "crates/core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.143"
serde_yaml = "0.9.34"
sha1 = "0.10.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = "0.7.18"
url = "2.5.8"
