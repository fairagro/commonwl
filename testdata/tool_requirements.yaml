requirements:
  DockerRequirement:
    dockerPull: docker.io/debian:stable-slim
  InlineJavascriptRequirement:
    expressionLib:
          - "function foo() { return 2; }"
  ShellCommandRequirement: {}
  ToolTimeLimit:
    timelimit: 0
  WorkReuse:
    enableReuse: false
  InitialWorkDirRequirement:
    listing:
      - entry: $(inputs.testdir)
        writable: false
  ResourceRequirement:
    coresMin: .5
  SchemaDefRequirement:
    types:
      - name: name
        type: record
        fields:
          - name: first
            type: string
          - name: last
            type: string
      - name: person
        type: record
        fields:
          - name: name
            type: name
          - name: age
            type: int
  EnvVarRequirement:
    envDef:
      TEST_ENV: $(inputs.in)
  NetworkAccess:
    networkAccess: true
