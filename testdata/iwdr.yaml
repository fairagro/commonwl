requirements:
  - class: InitialWorkDirRequirement
    listing:
      - $(inputs.INPUT)
  - class: InitialWorkDirRequirement
    listing:
      - entryname: input.txt
        entry: $(inputs.file)
  - class: InitialWorkDirRequirement
    listing:
      - entryname: file.txt
        entry: |
          ${return 'quote "' + inputs.quote + '"'}
      - entryname: script.sh
        entry: |
          set -xe
          cat file.txt
  - class: InitialWorkDirRequirement
    listing:
      - entry: ""
        entryname: secondary_file_test.txt
        writable: true
      - entry: ""
        entryname: secondary_file_test.accessory
        writable: true
  - class: InitialWorkDirRequirement
    listing:
      - entryname: script.sh
        entry: |
          echo \
            "My country, 'tis of thee," \
            "Sweet land of $(inputs.liberty)"

  - class: InitialWorkDirRequirement
    listing:
      - entryname: "out-filelist.json"
        entry: |
          ${
            var ls = [];
            for (var i = 1; i < 10000; i++) {
              ls.push("example_input_file"+i+".txt");
            }
            return {"filelist": ls};
          }
  - class: InitialWorkDirRequirement
    listing:
      - entryname: "renamed-filelist.txt"
        entry: |-
          $(inputs.filelist)
  - class: InitialWorkDirRequirement
    listing:
      - class: File
        location: ../loadContents/inp-filelist.txt
      - class: Directory
        location: ../testdir
  - class: InitialWorkDirRequirement
    listing:
      - entry: "${ return {class: 'Directory', basename: 'input_dir', listing: inputs.input_list} }"