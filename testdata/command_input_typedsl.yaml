inputs:
  outdir:
    type: string?
    doc: |
      Output directory, defaults to the current directory
    inputBinding:
      prefix: "--outdir"
  fasta_path:
    type:
      type: array
      items: File
    secondaryFiles:
      - pattern: .fai
        required: true
      - pattern: .crai
        required: false
      - .bai?
      - "${ if (inputs.require_dat) {return '.dat'} else {return null} }"
      - "${ return null; }"
      - pattern: .dat2
        required: $(inputs.require_dat)
  outdir_alt:
    type: string[]?
    doc: |
      Output directory, defaults to the current directory
    inputBinding:
      prefix: "--outdir"
